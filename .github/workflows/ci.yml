name: School Enrichment CI

# Adapted from the MathPath-Platform repo's mathpath-ci.yml (verified working
# there — see PROJECT_REFERENCE.md Section 8). Trimmed of MathPath-only
# pieces (the PowerShell delivery-console lint, the MathPath-specific
# generator regression job, the "conservative test plan" change-classifier)
# since this is a fresh repo with none of that tooling yet. Add that
# sophistication back later only if CI run time becomes a real cost —
# starting simple and unconditional is safer than a misclassified skip.

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: school-enrichment-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_ARTIFACT_RETENTION_DAYS: '14'

jobs:
  repository-safety:
    name: repository-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate diff and scan for secret-bearing paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            if printf '%s' "$BASE" | grep -Eq '^0+$'; then BASE="HEAD^"; fi
          else
            BASE_REF="${{ github.base_ref }}"
            if [ -z "$BASE_REF" ]; then BASE_REF="main"; fi
            git fetch origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          fi
          git diff --check "$BASE...HEAD"
          changed="$(git diff --name-only "$BASE...HEAD")"
          printf '%s\n' "$changed" | tee ci-artifacts/changed-files.txt
          secret_paths="$(printf '%s\n' "$changed" | grep -E '(^|/)(\.env($|\.)|.*\.pem$|.*\.key$|id_rsa$|credentials\.json$|secrets?\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$secret_paths" ]; then
            printf '%s\n' "$secret_paths" >&2
            echo 'Secret-bearing file path detected.' >&2
            exit 1
          fi
          {
            echo '## Repository safety'
            echo
            echo '- Git whitespace validation: passed'
            echo '- Secret-bearing changed paths: none'
            echo "- Changed file count: $(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
          } | tee ci-artifacts/repository-safety.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload repository safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts
          if-no-files-found: warn
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./school_enrichment_ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../ci-artifacts
          python -m pytest tests -q 2>&1 | tee ../ci-artifacts/backend-tests.txt
      - name: Publish backend summary
        if: always()
        shell: bash
        run: |
          echo '## Backend tests' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 ../ci-artifacts/backend-tests.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/backend-tests.txt
          if-no-files-found: warn
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

  frontend-typecheck:
    name: frontend-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run frontend typecheck
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../ci-artifacts
          npm run typecheck 2>&1 | tee ../ci-artifacts/frontend-typecheck.txt
      - name: Publish typecheck summary
        if: always()
        shell: bash
        run: |
          echo '## Frontend typecheck' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 ../ci-artifacts/frontend-typecheck.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload typecheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/frontend-typecheck.txt
          if-no-files-found: warn
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run frontend production build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../ci-artifacts
          npm run build 2>&1 | tee ../ci-artifacts/frontend-build.txt
      - name: Publish frontend build summary
        if: always()
        shell: bash
        run: |
          echo '## Frontend production build' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 ../ci-artifacts/frontend-build.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload frontend build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/frontend-build.txt
          if-no-files-found: warn
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

  frontend-e2e-tests:
    name: frontend-e2e-tests
    needs: [frontend-build, backend-tests]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./backend/school_enrichment_e2e.db
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - name: Check whether an e2e suite exists yet
        id: has_e2e
        shell: bash
        run: |
          if [ -f frontend/playwright.config.ts ] || [ -f frontend/playwright.config.js ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # NOTE: this job is a deliberate no-op until Playwright specs exist
      # (matches the blueprint's phased build plan — e2e coverage grows
      # with each phase, starting at Phase 3's objective learning loop).
      # A missing suite must never silently pass as "success" once real
      # attempt/scoring flows exist — remove this early-exit block the
      # moment frontend/tests/ has real specs in it.
      - uses: actions/setup-python@v5
        if: steps.has_e2e.outputs.present == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        if: steps.has_e2e.outputs.present == 'true'
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Boot backend server
        if: steps.has_e2e.outputs.present == 'true'
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
      - uses: actions/setup-node@v4
        if: steps.has_e2e.outputs.present == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: steps.has_e2e.outputs.present == 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        if: steps.has_e2e.outputs.present == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Boot frontend server
        if: steps.has_e2e.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm run build
          npm run start &
          sleep 10
      - name: Run Playwright suite
        if: steps.has_e2e.outputs.present == 'true'
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p ../ci-artifacts
          npx playwright test 2>&1 | tee ../ci-artifacts/frontend-e2e-tests.txt
      - name: Record no-suite-yet evidence
        if: steps.has_e2e.outputs.present != 'true'
        shell: bash
        run: |
          mkdir -p ci-artifacts
          echo 'No Playwright suite present yet — this job is a placeholder until one exists.' | tee ci-artifacts/frontend-e2e-tests.txt
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}
      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/frontend-e2e-tests.txt
          if-no-files-found: warn
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

  ci-summary:
    name: ci-summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - repository-safety
      - backend-tests
      - frontend-typecheck
      - frontend-build
      - frontend-e2e-tests
    steps:
      - name: Publish final CI result
        shell: bash
        env:
          SAFETY: ${{ needs.repository-safety.result }}
          BACKEND: ${{ needs.backend-tests.result }}
          TYPECHECK: ${{ needs.frontend-typecheck.result }}
          BUILD: ${{ needs.frontend-build.result }}
          E2E: ${{ needs.frontend-e2e-tests.result }}
        run: |
          set -euo pipefail
          {
            echo '## School Enrichment CI summary'
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Repository safety | $SAFETY |"
            echo "| Backend tests | $BACKEND |"
            echo "| Frontend typecheck | $TYPECHECK |"
            echo "| Frontend production build | $BUILD |"
            echo "| Frontend E2E tests | $E2E |"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$SAFETY" "$BACKEND" "$TYPECHECK" "$BUILD" "$E2E"; do
            if [ "$result" != 'success' ]; then
              echo "A required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
